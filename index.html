<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light">
<title>Закрытый документ</title>
<style>
  :root {
    --bg: #f6f8fb;
    --text: #0f1b2d;
    --muted: #4a5568;
    --navy: #0b1f3a;
    --blue: #1d4ed8;
    --border: #d8dee8;
    --red: #b91c1c;
    --red-bg: #fef2f2;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 1.5rem;
    font-family: var(--font);
    color: var(--text);
    background:
      radial-gradient(900px 420px at 10% -10%, rgba(37, 99, 235, 0.08), transparent 55%),
      linear-gradient(180deg, #fafbfd 0%, var(--bg) 100%);
  }
  .card {
    width: min(420px, 100%);
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: 0 10px 40px rgba(15, 27, 45, 0.08);
    padding: 1.75rem 1.5rem 1.5rem;
  }
  h1 { margin: 0 0 .5rem; font-size: 1.35rem; color: var(--navy); letter-spacing: -0.02em; }
  p { margin: 0; color: var(--muted); font-size: .95rem; line-height: 1.5; }
  form { margin-top: 1.25rem; display: grid; gap: .75rem; }
  label { font-size: .85rem; font-weight: 600; color: var(--navy); }
  input {
    width: 100%;
    font: inherit;
    padding: .7rem .8rem;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: #fff;
    color: var(--text);
  }
  input:focus { outline: 2px solid rgba(29, 78, 216, .35); border-color: var(--blue); }
  .row { display: flex; align-items: center; justify-content: space-between; gap: .75rem; }
  button {
    font: inherit;
    font-weight: 650;
    border: 0;
    border-radius: 10px;
    padding: .7rem 1rem;
    background: var(--navy);
    color: #fff;
    cursor: pointer;
  }
  button:disabled { opacity: .6; cursor: progress; }
  button.ghost {
    background: transparent;
    color: var(--blue);
    padding: 0;
    font-weight: 600;
    font-size: .85rem;
  }
  .err {
    margin: 0;
    padding: .65rem .75rem;
    border-radius: 10px;
    background: var(--red-bg);
    color: var(--red);
    font-size: .9rem;
  }
  .status { min-height: 1.25rem; font-size: .9rem; color: var(--muted); }
</style>
</head>
<body>
  <main class="card">
    <h1>Закрытый документ</h1>
    <p>Введите пароль, чтобы открыть документ. Проверка выполняется только в этом браузере, пароль никуда не отправляется.</p>
    <form id="gate" autocomplete="off">
      <label for="pw">Пароль</label>
      <input id="pw" name="password" type="password" autocomplete="current-password" spellcheck="false" required>
      <div class="row">
        <button class="ghost" id="toggle" type="button" aria-pressed="false">Показать пароль</button>
        <button id="submit" type="submit">Открыть</button>
      </div>
      <p class="status" id="status" role="status"></p>
      <p class="err" id="err" role="alert" hidden></p>
    </form>
  </main>
  <noscript><p>Чтобы открыть документ, включите JavaScript.</p></noscript>
  <script src="assets/u.471054b2faf1.js"></script>
</body>
</html>
