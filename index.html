<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#17140f">
<title>Закрытый документ</title>
<style>
  :root {
    --paper: #f3efe6;
    --paper-2: #fbf9f4;
    --ink: #17140f;
    --ink-2: #3f3b33;
    --ink-3: #6b665b;
    --rule: #d6cfbf;
    --signal: #d9401a;
    --signal-deep: #a92e0f;
    --bad: #b8281a;
    --bad-bg: #f6dad3;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
    --mono: "Cascadia Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 1.5rem;
    font-family: var(--sans);
    color: var(--ink);
    background: var(--paper);
  }
  .card {
    position: relative;
    width: min(440px, 100%);
    background: var(--paper-2);
    border: 1px solid var(--ink);
    border-top: 4px solid var(--ink);
    border-radius: 3px;
    box-shadow: 8px 8px 0 var(--rule);
    padding: 2rem 1.75rem 1.6rem;
  }
  .tag {
    display: flex; align-items: center; gap: .55rem; margin-bottom: 1.1rem;
    font-family: var(--mono); font-size: .68rem; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3);
  }
  .tag::before { content: ""; width: .55rem; height: .55rem; background: var(--signal); }
  h1 { margin: 0 0 .6rem; font-family: var(--serif); font-size: 1.9rem; line-height: 1.1; letter-spacing: -.02em; }
  p { margin: 0; color: var(--ink-2); font-size: .95rem; line-height: 1.55; }
  form { margin-top: 1.5rem; display: grid; gap: .7rem; }
  label { font-family: var(--mono); font-size: .7rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }
  input {
    width: 100%;
    font: inherit;
    font-family: var(--mono);
    letter-spacing: .08em;
    padding: .75rem .85rem;
    border: 1px solid var(--rule);
    border-radius: 2px;
    background: #fff;
    color: var(--ink);
  }
  input:focus { outline: 2px solid var(--signal); outline-offset: 0; border-color: var(--ink); }
  .row { display: flex; align-items: center; justify-content: space-between; gap: .75rem; margin-top: .2rem; }
  button {
    font-family: var(--mono);
    font-size: .78rem;
    font-weight: 700;
    letter-spacing: .1em;
    text-transform: uppercase;
    border: 0;
    border-radius: 2px;
    padding: .75rem 1.15rem;
    background: var(--signal);
    color: #fff;
    cursor: pointer;
    box-shadow: 3px 3px 0 var(--ink);
    transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
  }
  button:hover { background: var(--signal-deep); transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--ink); }
  button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  button:disabled { opacity: .6; cursor: progress; transform: none; }
  button.ghost {
    background: transparent;
    color: var(--ink);
    padding: 0;
    box-shadow: none;
    font-size: .7rem;
    text-decoration: underline;
    text-decoration-color: var(--signal);
    text-underline-offset: .25em;
  }
  button.ghost:hover { background: transparent; color: var(--signal-deep); transform: none; box-shadow: none; }
  .err {
    margin: 0;
    padding: .65rem .8rem;
    border-left: 3px solid var(--bad);
    background: var(--bad-bg);
    color: var(--bad);
    font-size: .9rem;
  }
  .status { min-height: 1.25rem; font-family: var(--mono); font-size: .76rem; color: var(--ink-3); }
</style>
</head>
<body>
  <main class="card">
    <div class="tag">Доступ по паролю</div>
    <h1>Закрытый документ</h1>
    <p>Введите пароль, чтобы открыть документ. Проверка выполняется только в этом браузере, пароль никуда не отправляется.</p>
    <form id="gate" autocomplete="off">
      <label for="pw">Пароль</label>
      <input id="pw" name="password" type="password" autocomplete="current-password" spellcheck="false" required>
      <div class="row">
        <button class="ghost" id="toggle" type="button" aria-pressed="false">Показать пароль</button>
        <button id="submit" type="submit">Открыть</button>
      </div>
      <p class="status" id="status" role="status"></p>
      <p class="err" id="err" role="alert" hidden></p>
    </form>
  </main>
  <noscript><p>Чтобы открыть документ, включите JavaScript.</p></noscript>
  <script src="assets/u.751747a64526.js"></script>
</body>
</html>
